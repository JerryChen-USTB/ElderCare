spring:
  profiles:
    active: dev   # 激活 dev 环境，因此 Spring Boot 会优先加载 application-dev.yml 文件中的配置

  application:
    name: ElderCare-backend
    
  # 配置DevTools排除语音记录目录，避免热更新重启
  devtools:
    restart:
      exclude: Speech_to_Text_Records/**

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/eldercare_project?useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:changeme}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl


langchain4j:
  open-ai:
    chat-model:
      base-url: ${AI_BASE_URL:https://api.siliconflow.cn/v1}
      api-key: ${AI_API_KEY:your-api-key-here}
      model-name: ${AI_MODEL:Qwen/Qwen2-7B-Instruct}
      log-requests: true
      log-responses: true
    streaming-chat-model:
      base-url: ${AI_BASE_URL:https://api.siliconflow.cn/v1}
      api-key: ${AI_API_KEY:your-api-key-here}
      model-name: ${AI_MODEL:Qwen/Qwen2-7B-Instruct}
      log-requests: true
      log-responses: true

logging:
  level:
    dev.langchain4j: debug